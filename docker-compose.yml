version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: playto_db
      POSTGRES_USER: playto
      POSTGRES_PASSWORD: playto
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: docker-secret-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://playto:playto@db:5432/playto_db
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py makemigrations merchants payouts &&
             python manage.py migrate &&
             python manage.py seed &&
             gunicorn playto.wsgi:application --bind 0.0.0.0:8000 --workers 4"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: docker-secret-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://playto:playto@db:5432/playto_db
      REDIS_URL: redis://redis:6379/0
    command: celery -A playto worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: docker-secret-change-in-prod
      DEBUG: "True"
      DATABASE_URL: postgres://playto:playto@db:5432/playto_db
      REDIS_URL: redis://redis:6379/0
    command: >
      sh -c "python manage.py makemigrations merchants payouts &&
             python manage.py migrate &&
             celery -A playto beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  pg_data:
